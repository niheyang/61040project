<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf8fa" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Share when you think of it. Catch up when you choose." />
    <title>Catchup · A little space for friends</title>
    <script>
      // Apply the preference before styles paint, including on page reloads.
      let catchupTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      try {
        const saved = localStorage.getItem("catchup-theme");
        if (saved === "light" || saved === "dark") catchupTheme = saved;
      } catch {}
      document.documentElement.dataset.theme = catchupTheme;
      document.documentElement.style.colorScheme = catchupTheme;
      document.querySelector('meta[name="theme-color"]').content = catchupTheme === "dark" ? "#0b2134" : "#edf8fa";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
